name: Deploy Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".gcloudignore"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "scripts/**"
      - "vite*"
      - "package*"
      - "tsconfig*"
      - "vitest*"
      - "patches/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fluxus-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'prospectafluxus-innoflow/cockpit-whatsapp-prospeccao' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4, resolved through GitHub CLI to a full commit SHA.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # v4, resolved through GitHub CLI to a full commit SHA.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Authenticate to Google Cloud
        # v3.0.0, resolved through GitHub CLI to a full commit SHA.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          # Resource names are public identifiers, never secret credentials.
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/664809259352/locations/global/workloadIdentityPools/fluxus-github/providers/github-main' }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'fluxus-deploy@project-1c43b517-221c-485f-9ce.iam.gserviceaccount.com' }}

      - name: Set up gcloud
        # v3.0.1, resolved through GitHub CLI to a full commit SHA.
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: project-1c43b517-221c-485f-9ce

      - name: Deploy source to Cloud Run
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git_sha="$(printf '%s' "${GITHUB_SHA}" | tr -cd '[:lower:][:digit:]')"
          if [ "${#git_sha}" -ne 40 ]; then
            echo "GITHUB_SHA did not sanitize to a 40-character revision label" >&2
            exit 1
          fi
          gcloud run deploy prospectafluxus \
            --source . \
            --project=project-1c43b517-221c-485f-9ce \
            --region=us-west1 \
            --build-service-account=projects/project-1c43b517-221c-485f-9ce/serviceAccounts/fluxus-build@project-1c43b517-221c-485f-9ce.iam.gserviceaccount.com \
            --service-account=fluxus-runtime@project-1c43b517-221c-485f-9ce.iam.gserviceaccount.com \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=1 \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=40 \
            --timeout=300s \
            --cpu-throttling \
            --quiet \
            --labels="git-sha=${git_sha}"

      - name: Smoke test public routes
        env:
          CLOUD_RUN_URL: https://prospectafluxus-664809259352.us-west1.run.app
        run: node scripts/verify-cloud-run.mjs

      - name: Verify Cloud Run revision provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git_sha="$(printf '%s' "${GITHUB_SHA}" | tr -cd '[:lower:][:digit:]')"
          revision="$(gcloud run services describe prospectafluxus \
            --project=project-1c43b517-221c-485f-9ce \
            --region=us-west1 \
            --format='value(status.latestReadyRevisionName)')"
          if [ -z "${revision}" ]; then
            echo "Cloud Run did not report a ready revision" >&2
            exit 1
          fi
          labeled_sha="$(gcloud run revisions describe "${revision}" \
            --project=project-1c43b517-221c-485f-9ce \
            --region=us-west1 \
            --format='value(metadata.labels.git-sha)')"
          if [ "${labeled_sha}" != "${git_sha}" ]; then
            echo "Cloud Run revision git-sha label does not match this commit" >&2
            exit 1
          fi
          printf 'cloud-run revision=%s git-sha=%s\n' "${revision}" "${labeled_sha}"
